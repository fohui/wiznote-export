[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wiznote-export"
version = "0.1.0"
description = "Export notes from the macOS WizNote app to Markdown"
requires-python = ">=3.9"
dependencies = ["beautifulsoup4>=4.12", "markdownify>=0.11"]

[project.scripts]
wiznote-export = "wiznote_export:main"

[tool.setuptools]
py-modules = ["wiznote_export"]
